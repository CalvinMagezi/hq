[package]
name = "pairspike"
version = "0.0.0"
edition = "2024"

# Not part of the HQ workspace: a throwaway proof of pairing two machines with a one-time ticket
# (shown as text and a QR code) over an iroh connection, then reconnecting by key alone.
[workspace]

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
data-encoding = "2"
qrcodegen = "1.8"
rand = "0.9"
subtle = "2"

[dev-dependencies]
tempfile = "3"
