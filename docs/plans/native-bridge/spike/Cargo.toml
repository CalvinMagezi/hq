[package]
name = "meshspike"
version = "0.0.0"
edition = "2024"

# Not part of the HQ workspace: a throwaway proof that the existing host gate
# protocol can ride an iroh connection unchanged.
[workspace]

[dependencies]
iroh = "1.3"
hq-host = { path = "../../../../crates/hq-host" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
tempfile = "3"
