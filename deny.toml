# cargo-deny policy for an MIT-licensed project. Run: cargo deny check
[graph]
# aarch64-linux-android is here so dependencies only the phone build pulls in are checked too.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "aarch64-linux-android"]

[advisories]
version = 2
yanked = "deny"
# Each ignore needs the advisory id and a reason. Keep each reason current.
ignore = [
    { id = "RUSTSEC-2025-0012", reason = "backoff is unmaintained (no vulnerability). Pulled in only by async-openai 0.27; drop when async-openai is upgraded." },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained (no vulnerability). Transitive via backoff, same exit as RUSTSEC-2025-0012." },
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained proc-macro that runs at build time only. Transitive via rav1e/ravif/image." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is an unmaintained build-time proc-macro. Transitive via aquamarine/teloxide." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained (no vulnerability). Transitive via lopdf/pdf-extract and ab_glyph/imageproc." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained (no vulnerability). Comes with serde_yaml 0.9, which HQ's config and frontmatter code uses directly and figment and hayagriva also pull in; moving off serde_yaml is tracked in TECHDEBT.md." },
    # Unmaintained notices (no vulnerability) that arrive only through Typst, the
    # renderer behind hq-export. Same exit as the quick-xml ids below: drop them
    # when typst moves off these crates.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x is unmaintained (no vulnerability). Transitive via syntect, Typst's code highlighting." },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained (no vulnerability). Transitive via syntect, Typst's code highlighting." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained (no vulnerability). Text shaping in typst-layout and krilla (hq-export's PDF/PNG/SVG renderer)." },
    # Two real vulnerabilities, accepted on purpose and only until upstream moves.
    # quick-xml 0.38.4 comes from typst -> typst-library -> hayagriva -> citationberg
    # (hq-export's PDF/PNG/SVG renderer). citationberg 0.7.0, hayagriva 0.10.1 and
    # typst 0.15.1 are the latest releases, and hayagriva is a non-optional
    # dependency of typst-library, so no upgrade or feature switch removes it.
    # Not reachable from note content: citationberg parses CSL citation-style XML,
    # which Typst reads only for `bibliography` and `cite`; hq-export never emits
    # either, its file resolver serves only in-memory images under generated
    # names, and note text is escaped so it cannot become Typst code.
    # Drop both ids when citationberg depends on quick-xml >= 0.41. Keep in step
    # with .cargo/audit.toml, which `cargo audit` reads.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 quadratic duplicate-attribute check, via typst/citationberg. Parser is not reachable from note content; see the comment above." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 unbounded namespace-declaration allocation, via typst/citationberg. Parser is not reachable from note content; see the comment above." },
    # A yanked crate, accepted on purpose and only until 2026-10-31.
    # zip 8.6.0 is yanked, and so is every zip release except 9.0.3. The maintainers
    # yanked them for GHSA-4v9h-p7m9-rh26, GHSA-vv5m-jxxh-4627 and GHSA-4684-h2q9-2vcp
    # (symlink and permission handling when extracting an archive to disk) and say more
    # advisories will follow later in October 2026 (zip-rs/zip2 issue 1075).
    # Nothing here calls the extraction code: hq-export only writes zips (it reads them
    # only in tests), docx-rs and umya-spreadsheet read entries into memory, rust_xlsxwriter
    # only writes, and transmutation only lists entry names and sizes. hq-convert's import
    # reader uses zip 9 and reads entries into memory under size limits; it never extracts.
    # Upgrade status on 2026-10-18: rust_xlsxwriter 0.100 requires zip 9, but docx-rs 0.4.22,
    # umya-spreadsheet 3.1.1 and transmutation 0.3.5 are their latest releases and all still
    # require zip 8, so zip 8.6.0 stays in Cargo.lock until all three move.
    # Review on 2026-10-31, when the promised advisories should be out: re-read them against
    # the code above, and drop this entry once those crates ship builds that use zip 9.
    # Tracked as HQ-VMS-036.
    { crate = "zip@8.6.0", reason = "Yanked with all other zip releases except 9.0.3 after GHSA-4v9h-p7m9-rh26, GHSA-vv5m-jxxh-4627 and GHSA-4684-h2q9-2vcp, which are all in archive extraction that nothing here calls. No upgrade exists yet because docx-rs, umya-spreadsheet and transmutation require zip 8. Expires 2026-10-31; see the comment above." },
    # Advisories published after the yank (the follow-ups announced above). All three are in
    # ZipArchive::extract and ZipStreamReader::extract, which nothing here calls (the
    # callers are checked in the comment above). Same exit and same review date as the
    # yanked entry. Keep in step with .cargo/audit.toml, which `cargo audit` reads.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 keeps SUID/SGID bits when extracting an archive to disk. Nothing calls ZipArchive::extract or ZipStreamReader::extract; see the comment above. Expires 2026-10-31." },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 ZipArchive::extract creates symlinks whose targets can leave the destination directory. Nothing calls the extraction code; see the comment above. Expires 2026-10-31." },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 ZipArchive::extract and ZipStreamReader::extract apply Unix permissions through symlinks. Nothing calls the extraction code; see the comment above. Expires 2026-10-31." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. MPL-2.0 is file-level copyleft and is fine for
# unmodified dependencies. GPL/AGPL/LGPL-only crates are rejected by omission.
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0",
    "Unlicense", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0",
    "bzip2-1.0.6", "MPL-2.0",
    # A permissive licence for data (here, the Mozilla root certificate list compiled into
    # webpki-roots): use, copy and redistribute with the licence text kept, no copyleft, so it is
    # compatible with an MIT project. webpki-roots 1.0.10 arrives only through hq-edge and iroh
    # (iroh-relay, tokio-rustls-acme, n0-dns-resolver).
    "CDLA-Permissive-2.0",
]

# webpki-roots is the Mozilla root certificate list as data, under CDLA-Permissive-2.0: a
# permissive license (attribution, no copyleft). iroh-relay and n0-dns-resolver use it, so
# hq-bridge brings it in. Allowed for this one crate only, not for every crate.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]

# Workspace crates do not yet set `license.workspace = true` (crates/ is out of
# scope for the CI change). Drop these clarifications once they do.

[[licenses.clarify]]
crate = "hq-agent"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0 }]

