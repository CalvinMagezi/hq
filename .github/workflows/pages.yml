name: Pages

# Publishes apps/site to GitHub Pages (https://agent-hq.online). Pages itself
# must be enabled by a maintainer in the repository settings.
#
# The site serves install.sh and install.ps1, the trust root of a first install, so the job that
# runs package code (bun install, astro build) is not the one that hands the site to Pages. `build`
# installs with lifecycle scripts off and uploads dist/ as a plain artifact. `verify` runs no package
# code: it compares both install scripts in that artifact byte for byte with its own checkout of
# apps/site/public, checks each embeds release/minisign.pub and no other key, and only then makes
# the Pages artifact. `build` has finished, and its runner is gone, before `verify` starts, so
# nothing it left behind can change the files after the check.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "release/minisign.pub"
      - "scripts/check-site-install-scripts.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout only
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # No dependency of the site needs an install script (astro, axe-core, playwright-core).
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: apps/site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Check the install scripts, then hand the site to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # sparse checkout of the reviewed scripts and the key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/site/public/install.sh
            apps/site/public/install.ps1
            release/minisign.pub
            scripts/check-site-install-scripts.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: ${{ runner.temp }}/site
      - name: The served install scripts are the reviewed ones and carry only the release key
        run: bash scripts/check-site-install-scripts.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
