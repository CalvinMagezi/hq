name: Android

# Builds hq for 64-bit Android (aarch64-linux-android) with the NDK and keeps the binary as a
# workflow artifact. It also fails when a LOAD segment is not aligned to 16 KB pages, which Google
# Play requires of native code in apps that target Android 15 or newer. The artifact is not
# signed and not attached to a release by this workflow: release.yml calls it (workflow_call) and
# packages the binary into the signed APK.
# Runs on main, on pull requests that could break the Android build (dependencies, manifests, this
# file), weekly, and by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "scripts/check-android-alignment.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "crates/hq-tunnel/**"
      - "crates/hq-cli/src/commands/net_tunnel.rs"
      - "crates/hq-bridge/**"
      - "crates/hq-cli/src/commands/bridge.rs"
      - "crates/hq-cli/src/commands/bridge_control.rs"
      - "crates/hq-cli/src/android_runtime.rs"
  # Weekly, so a Rust-only change that breaks the Android build is found even when no pull request
  # touched the files above.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version `hq --version` reports; empty for the Cargo.toml version"
        type: string
        default: ""
    outputs:
      sha256:
        description: "sha256 of hq-android-arm64, from the job that built it. Callers check the artifact against this, not against the .sha256 file inside it."
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  NDK_VERSION: "28.2.13676358"
  # The oldest Android release the build targets; the NDK's clang wrappers are named after it.
  ANDROID_API: "26"
  HQ_TARGET: aarch64-linux-android

jobs:
  build:
    name: Build hq (aarch64-linux-android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$HQ_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Install the NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "NDK=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build hq
        env:
          HQ_GIT_SHA: ${{ github.sha }}
          HQ_BUILD_VERSION: ${{ inputs.version }}
        run: |
          # The release key is compiled in so `hq update verify-file` (the app's updater) can check signed channel manifests.
          HQ_UPDATE_PUBKEY=$(sed -n 2p release/minisign.pub)
          export HQ_UPDATE_PUBKEY
          tc="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_HOME="$NDK" ANDROID_NDK_ROOT="$NDK"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android${ANDROID_API}-clang"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android${ANDROID_API}-clang"
          export PATH="$tc:$PATH"
          # `tunnel`: the phone runs `hq net tunnel run` as a second process beside the hub.
          # `bridge`: the phone app drives `hq bridge run` (QR pairing, docs/PAIRING.md).
          cargo build -p hq-cli --profile release-small --target "$HQ_TARGET" --features tunnel,bridge --locked

      - name: Check the binary
        run: |
          bin="target/$HQ_TARGET/release-small/hq"
          file "$bin" | grep -q "ARM aarch64" || { echo "not an aarch64 binary" >&2; file "$bin" >&2; exit 1; }
          bash scripts/check-android-alignment.sh "$bin" "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          ls -l "$bin"

      - name: Record the size of the phone build
        # Nothing recorded the size of hq on a phone, so no change could be judged by it
        # (docs/plans/modular-hq.md, step A3). This only reports: a ceiling comes once the owner
        # has set one.
        run: |
          bin="target/$HQ_TARGET/release-small/hq"
          bytes=$(stat -c %s "$bin")
          crates=$(cargo tree -p hq-cli --features tunnel,bridge -e normal --prefix none --target "$HQ_TARGET" --locked \
            | sed -E 's/ \((\*|proc-macro)\)//g; s/ \(\/.*\)$//' | sort -u | wc -l)
          {
            echo "### Phone build size"
            echo "| | |"
            echo "|---|---|"
            echo "| hq (release-small, $HQ_TARGET) | $bytes bytes ($((bytes / 1048576)) MiB) |"
            echo "| crate versions linked | $crates |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package
        id: package
        run: |
          mkdir -p dist
          cp "target/$HQ_TARGET/release-small/hq" dist/hq-android-arm64
          (cd dist && sha256sum hq-android-arm64 > hq-android-arm64.sha256)
          sum=$(cat dist/hq-android-arm64.sha256)
          echo "sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hq-android-arm64
          path: |
            dist/hq-android-arm64
            dist/hq-android-arm64.sha256
          if-no-files-found: error
          retention-days: 14
