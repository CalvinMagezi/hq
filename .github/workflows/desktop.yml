name: Desktop app

# Builds the macOS app unsigned and runs the checks the Linux job cannot (the shell needs a web
# view). The logic and its tests are in crates/hq-desktop and run in the main CI job. No secrets,
# read-only token, safe for fork pull requests; signing and notarization are a release step.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/hq-desktop/**"
      - "crates/hq-bridge/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/hq-desktop/**"
      - "crates/hq-bridge/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.98.1"
  BUN_VERSION: "1.3.14"

jobs:
  macos-app:
    name: macOS app (clippy, build, unsigned)
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:ui

      - name: Shell (fmt, clippy)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build the app (unsigned)
        run: bun run build

      - name: Check the bundle
        run: |
          app="src-tauri/target/release/bundle/macos/HQ.app"
          test -x "$app/Contents/MacOS/hq-desktop"
          plutil -extract NSLocalNetworkUsageDescription raw "$app/Contents/Info.plist"
