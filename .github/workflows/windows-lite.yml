name: Windows Lite

# Builds the native Windows edition (HQ Lite) as a portable zip: hq.exe, the web app, and a
# SHA-256 file. Manual only, and separate from the signed release pipeline, which it does not
# touch: Lite is unsigned for now (verify the SHA-256), and it is updated by running the
# installer again. Give `release_tag` to attach the files to an existing release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the zip to. Leave empty to only keep it as a workflow artifact."
        type: string
        default: ""

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  BUN_VERSION: "1.3.14"

jobs:
  build:
    name: Build HQ Lite (windows-x86_64)
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read # checkout only
    outputs:
      name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the web app
        working-directory: apps/hq-web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build hq.exe
        shell: pwsh
        env:
          HQ_GIT_SHA: ${{ github.sha }}
        run: cargo build -p hq-cli --release --locked

      - name: Check there is no Visual C++ runtime dependency
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target\release\hq.exe"))
          if ($text -match '(VCRUNTIME140|MSVCP140|CONCRT140)') { throw 'hq.exe imports the Visual C++ runtime DLLs' }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages | Where-Object name -eq 'hq-cli' | ForEach-Object version
          $short = "${{ github.sha }}".Substring(0, 7)
          $name = "hq-lite-$version-$short-windows-x86_64"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force "$dir\web" | Out-Null
          Copy-Item target\release\hq.exe "$dir\hq.exe"
          Copy-Item -Recurse apps\hq-web\dist\client\* "$dir\web\"
          @"
          HQ Lite for Windows (portable, no installer, no administrator rights needed).

          Run:      .\hq.exe web          (opens the web app on this machine)
          Tasks:    .\hq.exe task list
          Editors:  .\hq.exe mcp install

          This build is not code-signed. Check the zip against the published SHA-256 before
          running it. Organizations that restrict programs (AppLocker, Smart App Control) may
          block it; docs/HQ_LITE.md lists the options that need no program on this computer.
          "@ | Set-Content "$dir\README.txt"
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\$name.zip.sha256", "$hash  $name.zip`n")
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hq-lite-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach to release
    needs: [build]
    # Only from main: a manual run on another branch must not attach its build to a release.
    if: inputs.release_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hq-lite-windows-x86_64
          path: lite
      - name: Upload
        run: gh release upload "$TAG" lite/*.zip lite/*.sha256
