name: Publish npm installer

# Publishes packages/agent-hq to npm with provenance. Manual only, from main.
# Uses npm trusted publishing (OIDC): configure this workflow as a trusted publisher
# for the package on npmjs.com. No npm token is stored in the repository.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish agent-hq-cli
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        working-directory: packages/agent-hq
        run: npm test
      - name: Publish
        working-directory: packages/agent-hq
        # Trusted publishing: npm exchanges the workflow's OIDC token, so no npm token is stored.
        run: |
          npm install --global npm@11.6.2 # zizmor: ignore[adhoc-packages] trusted publishing needs npm 11.5.1 or newer, pinned exactly
          npm publish --provenance --access public
