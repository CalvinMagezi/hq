name: Desktop release

# Builds the macOS app, then signs it and wraps it in a DMG. Run by hand, or by pushing a
# `desktop-v*` tag. The build job runs repository build code and so never sees a secret; the sign
# job runs only scripts/desktop/sign-macos.sh on the downloaded bundle, the same split release.yml
# makes. Without the Apple secrets the sign job signs ad hoc, which Gatekeeper refuses on a
# downloaded app, so such a DMG is for testing only. Secrets (environment `desktop-release`):
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, optional APPLE_SIGNING_IDENTITY, and for
# notarization APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8. See docs/DESKTOP.md.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.98.1"
  BUN_VERSION: "1.3.14"

jobs:
  build:
    name: Build HQ.app (no secrets)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build the app (unsigned)
        run: bun run build

      - name: Pack the bundle
        # A tarball keeps the bundle's symlinks and permissions through the artifact upload.
        run: tar -C src-tauri/target/release/bundle/macos -czf "$RUNNER_TEMP/HQ.app.tar.gz" HQ.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hq-app-unsigned
          path: ${{ runner.temp }}/HQ.app.tar.gz
          retention-days: 7

  sign:
    name: Sign, notarize and package
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/desktop

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hq-app-unsigned
          path: ${{ runner.temp }}/in

      - name: Sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/out"
          tar -C "$RUNNER_TEMP/app" -xzf "$RUNNER_TEMP/in/HQ.app.tar.gz"
          bash scripts/desktop/sign-macos.sh "$RUNNER_TEMP/app/HQ.app" "$RUNNER_TEMP/out/HQ.dmg"
          shasum -a 256 "$RUNNER_TEMP/out/HQ.dmg" | tee "$RUNNER_TEMP/out/HQ.dmg.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hq-desktop-dmg
          path: |
            ${{ runner.temp }}/out/HQ.dmg
            ${{ runner.temp }}/out/HQ.dmg.sha256
          retention-days: 30
