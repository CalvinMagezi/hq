name: Android app

# Builds the hub app with Gradle (no hq inside), runs its unit tests and the NewApi lint check that
# keeps post-Android-8 APIs out. The phone APK is built by hand (apps/android/README.md) because it
# packages binaries that android.yml builds.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Build, test and lint the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install an Android platform
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Check the Gradle wrapper jar
        # The sha256 Gradle publishes for gradle-8.14.3-wrapper.jar; bump it with the wrapper version.
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  apps/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Build, test and lint
        working-directory: apps/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
