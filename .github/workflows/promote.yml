name: Promote

# Points the stable channel at an existing main-built release. Manual runs
# only, and always from main. It signs a new channel pointer and changes no
# release artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote, for example v0.9.1-main.57"
        required: true
        type: string
      rollout:
        description: "Share of phones offered the Android update, 0 to 100"
        required: false
        default: "100"
        type: string

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and publish channel-stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # create releases and upload assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse any ref but main, and a malformed tag
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "promote runs from main only" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-main\.[0-9]+)?$ ]] || { echo "bad tag '$TAG'" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned minisign and jq
        run: |
          dir=$(bash scripts/release/install-tools.sh "$RUNNER_TEMP/tools")
          echo "$dir" >> "$GITHUB_PATH"

      - name: Check the release exists and was built from main
        run: |
          gh release view "$TAG" --json tagName > /dev/null
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          git merge-base --is-ancestor "$tag_sha" origin/main ||
            { echo "$TAG ($tag_sha) is not on main" >&2; exit 1; }
          echo "TAG_SHA=$tag_sha" >> "$GITHUB_ENV"

      - name: Verify signature and checksums with the repo public key
        run: |
          rm -rf promote-dl
          bash scripts/release/verify.sh --repo "$GH_REPO" --tag "$TAG" --pubkey release/minisign.pub --dir promote-dl
          manifest_sha=$(jq -r .git_sha promote-dl/manifest.json)
          [ "$manifest_sha" = "$TAG_SHA" ] || { echo "manifest git_sha does not match the tag" >&2; exit 1; }
          [ "v$(jq -r .version promote-dl/manifest.json)" = "$TAG" ] || { echo "manifest version does not match the tag" >&2; exit 1; }
          [ "$(jq -r .channel promote-dl/manifest.json)" = "main" ] || { echo "release was not built for the main channel" >&2; exit 1; }

      - name: Sign and publish channel-stable
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash scripts/release/channel.sh --channel stable --manifest promote-dl/manifest.json --repo "$GH_REPO" --seq "$((RUN_NUMBER * 1000 + ATTEMPT))" --out promote-dl/channel-stable.json
          bash scripts/release/sign.sh promote-dl/channel-stable.json
          gh release view channel-stable > /dev/null 2>&1 ||
            gh release create channel-stable --title "channel-stable" \
              --notes "Signed pointer to the promoted release. Not a downloadable build."
          gh release upload channel-stable promote-dl/channel-stable.json promote-dl/channel-stable.json.minisig --clobber

      # The app's updater reads the stable channel from the latest release, so the Android manifest
      # the tag was published with moves to channel-stable too, and channel-stable is the latest release.
      - name: Promote the Android update manifest
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          rm -rf promote-android
          mkdir promote-android
          # A tag without an Android build is fine; a download that fails for another reason is not.
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx android-channel.json; then
            echo "::notice::$TAG has no Android build; channel-stable keeps its previous Android manifest"
            exit 0
          fi
          gh release download "$TAG" --dir promote-android --pattern android-channel.json --pattern android-channel.json.minisig
          minisign -V -p release/minisign.pub -m promote-android/android-channel.json -x promote-android/android-channel.json.minisig -q
          [ "$(jq -r .version promote-android/android-channel.json)" = "${TAG#v}" ] || { echo "android manifest version does not match the tag" >&2; exit 1; }
          # The APK goes along so the website can link one fixed address (releases/latest/download/...).
          gh release download "$TAG" --dir promote-android --pattern agent-hq-android.apk --pattern agent-hq-android.apk.sha256
          (cd promote-android && sha256sum -c agent-hq-android.apk.sha256)
          [ "$(sha256sum promote-android/agent-hq-android.apk | cut -d' ' -f1)" = "$(jq -r .sha256 promote-android/android-channel.json)" ] || { echo "the APK does not match its signed manifest" >&2; exit 1; }
          # A new file from the verified one, signed again: promote sets its own rollout and a higher
          # seq, so a phone can tell it from the release's and never takes an older one back.
          [[ "$ROLLOUT" =~ ^[0-9]+$ ]] && [ "$ROLLOUT" -le 100 ] || { echo "rollout is 0 to 100" >&2; exit 1; }
          # Versions withdrawn on the stable channel stay withdrawn: carry its signed list over. The
          # list is only as good as the manifest it comes from, so that manifest must be the newest
          # this channel published: its seq may not be below the android-stable-seq-* floor
          # (scripts/release/android-seq.sh), and with a floor recorded it may not be missing.
          withdrawn='[]'
          cur_seq=0
          mkdir -p promote-android/current
          if gh release view channel-stable --json assets --jq '.assets[].name' | grep -qx android-channel.json; then
            gh release download channel-stable --dir promote-android/current --pattern android-channel.json --pattern android-channel.json.minisig
            minisign -V -p release/minisign.pub -m promote-android/current/android-channel.json -x promote-android/current/android-channel.json.minisig -q
            cur_seq=$(jq -r '.seq // 0' promote-android/current/android-channel.json)
            withdrawn=$(jq -c '.withdrawn // []' promote-android/current/android-channel.json)
          fi
          bash scripts/release/android-seq.sh check --repo "$GH_REPO" --seq "$cur_seq"
          new_seq=$(date -u +%s)
          [ "$new_seq" -gt "$cur_seq" ] || { echo "the clock is behind the current manifest's seq $cur_seq" >&2; exit 1; }
          jq --argjson seq "$new_seq" --argjson rollout "$ROLLOUT" --argjson kept "$withdrawn" \
            --arg issued "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.seq = $seq | .rollout = $rollout | .issued_at = $issued | .withdrawn = (((.withdrawn // []) + $kept) | unique)' \
            promote-android/android-channel.json > promote-android/android-channel.next.json
          mv promote-android/android-channel.next.json promote-android/android-channel.json
          bash scripts/release/sign.sh promote-android/android-channel.json
          minisign -V -p release/minisign.pub -m promote-android/android-channel.json -x promote-android/android-channel.json.minisig -q
          gh release upload channel-stable promote-android/android-channel.json promote-android/android-channel.json.minisig \
            promote-android/agent-hq-android.apk promote-android/agent-hq-android.apk.sha256 --clobber
          # Raise the floor only once the file is published, so a failed upload never strands it.
          bash scripts/release/android-seq.sh record --repo "$GH_REPO" --seq "$new_seq" --sha "$GITHUB_SHA"
          gh release edit channel-stable --latest
