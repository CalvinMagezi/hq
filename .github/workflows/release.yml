name: Release

# Builds, signs and publishes a prerelease on every push to main and on manual
# runs. Every merge therefore produces a signed release that instances on the
# main channel install, so main must stay protected: pull requests only, with the
# required checks (see deploy/runner/RUNBOOK.md, "Required GitHub settings").
# Forks that want manual releases only can delete the `push` trigger.
on:
  workflow_dispatch:
    inputs:
      requires_db_snapshot:
        description: "Release has schema changes that need the pre-update database restored on rollback"
        type: boolean
        default: false
      min_updater_version:
        description: "Override the floor in release/min-updater-version. Leave empty. Raising it strands older updaters."
        type: string
        default: ""
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  BUN_VERSION: "1.3.14"
  # Caddy for the Android APK (linux/arm64), pinned by version and checksum like the other tools.
  CADDY_VERSION: "2.11.7"
  CADDY_ARM64_SHA256: "d8fc6d179a5d283028a472a5618564f6ad8a86fed513e64f032b3b0b7cc45e42"

# Linux binaries are built on ubuntu-22.04 images so they only need glibc 2.35 and
# run on Ubuntu 22.04 hosts and newer. A newer runner image links against a newer
# glibc and the updater refuses it on older hosts (its pre-swap `--version` check fails).

# Jobs that run repository build code (`test`, the `build` legs, `web`,
# `android-hq`) never see the signing key: they have no environment and no
# secrets. They do hold the run's artifact token, though, and `test` runs every
# dev-dependency and bun package while the other jobs are still going, so any of
# them could delete and re-upload another job's artifact under the same name.
# Artifacts are therefore never trusted by name. Each job that produces one
# hashes it in that same job and publishes the hash as a job output, which no
# other job can change: `package` checks every binary and the web build against
# those outputs before packaging and publishes the manifest's hash as its own
# output, and `sign` refuses to sign unless the downloaded manifest has exactly
# that hash (the manifest pins every tarball, and verify.sh checks them before
# anything is published). The Android jobs anchor their inputs the same way.
# What this does not cover: a hostile dependency of hq-cli itself runs inside a
# build leg and can poison that leg's binary (and its output) at build time, so
# review of Cargo.lock changes still matters. `package` and `sign` run no build
# code, only the release scripts. Change `runs-on` to move a job between a
# persistent self-hosted runner and an ephemeral one.
jobs:
  test:
    name: Test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config perl libssl-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The hq-web CSP tests skip silently without a built app, so build it first and require it.
      - name: Build web app
        working-directory: apps/hq-web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Restored after the disk cleanup above: the cached target directory is large.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: release-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
        env:
          HQ_REQUIRE_BUILT_APP: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"

  version:
    name: Compute version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout only
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install pinned jq
        run: |
          dir=$(bash scripts/release/install-tools.sh "$RUNNER_TEMP/tools")
          echo "$dir" >> "$GITHUB_PATH"

      - name: Compute version
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="hq-cli") | .version')
          echo "version=${base}-main.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-main.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  # One leg per platform. A leg runs repository build code, so it has no
  # secrets and no environment; the signing key lives only in `sign`.
  # linux-x86_64 stays on ubuntu-22.04 (glibc 2.35 floor) and its artifact name
  # is frozen: updaters released before multi-platform builds look for it by name.
  build:
    name: Build ${{ matrix.platform }}
    if: github.ref == 'refs/heads/main'
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read # checkout only
    # One output per platform, written only by that platform's leg (a matrix
    # job's outputs are the union of what its legs set). `package` checks the
    # downloaded binaries against these, never against anything in an artifact.
    outputs:
      sha256_linux_x86_64: ${{ steps.hash.outputs.sha256_linux_x86_64 }}
      sha256_linux_aarch64: ${{ steps.hash.outputs.sha256_linux_aarch64 }}
      sha256_darwin_aarch64: ${{ steps.hash.outputs.sha256_darwin_aarch64 }}
      sha256_darwin_x86_64: ${{ steps.hash.outputs.sha256_darwin_x86_64 }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: darwin-aarch64
            runner: macos-15
          # Intel Macs, cross-compiled on the Apple Silicon runner and checked under Rosetta.
          - platform: darwin-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config perl libssl-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: release-build-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build hq
        env:
          HQ_GIT_SHA: ${{ github.sha }}
          HQ_BUILD_VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          HQ_UPDATE_PUBKEY=$(sed -n 2p release/minisign.pub)
          export HQ_UPDATE_PUBKEY
          if [ -n "$TARGET" ]; then
            rustup target add "$TARGET"
            cargo build --release --locked -p hq-cli --target "$TARGET"
            mkdir -p target/release
            cp "target/$TARGET/release/hq" target/release/hq
          else
            cargo build --release --locked -p hq-cli
          fi

      - name: Check the binary reports its identity
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GIT_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = "x86_64-apple-darwin" ]; then
            out=$(arch -x86_64 target/release/hq --version)
          else
            out=$(target/release/hq --version)
          fi
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "version missing from --version" >&2; exit 1 ;; esac
          case "$out" in *"${GIT_SHA:0:7}"*) ;; *) echo "git sha missing from --version" >&2; exit 1 ;; esac

      - name: Hash the binary
        id: hash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if command -v sha256sum > /dev/null; then sum=$(sha256sum target/release/hq); else sum=$(shasum -a 256 target/release/hq); fi
          echo "sha256_${PLATFORM//-/_}=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hq-bin-${{ matrix.platform }}
          path: target/release/hq
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    outputs:
      tree_sha256: ${{ steps.hash.outputs.tree_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build web
        working-directory: apps/hq-web
        run: |
          bun install --frozen-lockfile
          bun run build

      # One hash over every file's path and content, published as a job output. The
      # consumers recompute it over the whole downloaded tree, so a file added,
      # removed or changed after this step fails them. Hidden paths are left out here
      # only because upload-artifact leaves them out of the artifact.
      - name: Hash the web build
        id: hash
        working-directory: apps/hq-web/dist/client
        run: |
          tree=$(find . -mindepth 1 -name '.*' -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum)
          echo "tree_sha256=${tree%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/hq-web/dist/client
          if-no-files-found: error
          retention-days: 7

  # Runs no build code and installs nothing: only the release script, with the
  # runner's own jq, on artifacts built by the jobs above, after checking each one
  # against the hash its own job published.
  package:
    name: Package
    if: github.ref == 'refs/heads/main'
    needs: [version, build, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    outputs:
      manifest_sha256: ${{ steps.anchor.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hq-bin-*
          path: hq-bins

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web-dist

      # The expected hashes are job outputs of `build` and `web`, which no other job
      # can change. The artifacts themselves are only as trustworthy as every job
      # that holds this run's artifact token.
      - name: Check the artifacts against the hashes their jobs published
        env:
          SHA_LINUX_X86_64: ${{ needs.build.outputs.sha256_linux_x86_64 }}
          SHA_LINUX_AARCH64: ${{ needs.build.outputs.sha256_linux_aarch64 }}
          SHA_DARWIN_AARCH64: ${{ needs.build.outputs.sha256_darwin_aarch64 }}
          SHA_DARWIN_X86_64: ${{ needs.build.outputs.sha256_darwin_x86_64 }}
          WEB_TREE_SHA256: ${{ needs.web.outputs.tree_sha256 }}
        run: |
          for want in "$SHA_LINUX_X86_64" "$SHA_LINUX_AARCH64" "$SHA_DARWIN_AARCH64" "$SHA_DARWIN_X86_64" "$WEB_TREE_SHA256"; do
            [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "a build job did not publish its hash" >&2; exit 1; }
          done
          printf '%s  %s\n' \
            "$SHA_LINUX_X86_64" hq-bins/hq-bin-linux-x86_64/hq \
            "$SHA_LINUX_AARCH64" hq-bins/hq-bin-linux-aarch64/hq \
            "$SHA_DARWIN_AARCH64" hq-bins/hq-bin-darwin-aarch64/hq \
            "$SHA_DARWIN_X86_64" hq-bins/hq-bin-darwin-x86_64/hq | sha256sum --check --strict -
          # Every file, hidden ones included: the web job's tree has none, so one here was added later.
          tree=$(cd web-dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum)
          [ "${tree%% *}" = "$WEB_TREE_SHA256" ] || { echo "web-dist is not the tree the web job built" >&2; exit 1; }
          # Nothing but regular files and directories, so the hashes above cover everything packaged.
          [ -z "$(find hq-bins web-dist ! -type f ! -type d)" ] || { echo "artifacts hold something other than files" >&2; exit 1; }

      - name: Package (unsigned)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GIT_SHA: ${{ github.sha }}
          REQUIRES_SNAPSHOT: ${{ inputs.requires_db_snapshot || 'false' }}
          MIN_UPDATER: ${{ inputs.min_updater_version }}
        run: |
          rm -rf dist-release
          extra=()
          [ -z "$MIN_UPDATER" ] || extra+=(--min-updater-version "$MIN_UPDATER")
          bin_args=()
          for platform in linux-x86_64 linux-aarch64 darwin-aarch64 darwin-x86_64; do
            bin_args+=(--bin "$platform=hq-bins/hq-bin-$platform/hq")
          done
          bash scripts/release/package.sh --version "$VERSION" --git-sha "$GIT_SHA" --channel main \
            --requires-db-snapshot "$REQUIRES_SNAPSHOT" "${extra[@]}" \
            "${bin_args[@]}" --web-dist web-dist --out dist-release

      # The manifest names every tarball's sha256, so its own hash pins the whole bundle.
      - name: Publish the manifest hash
        id: anchor
        run: |
          sum=$(sha256sum dist-release/manifest.json)
          echo "manifest_sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist-release
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and publish
    needs: [test, version, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create releases and upload assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "release runs from main only" >&2; exit 1; }'

      # Only the release scripts and the public key, at the exact commit that was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            release
          sparse-checkout-cone-mode: false

      - name: Install pinned minisign and jq
        run: |
          dir=$(bash scripts/release/install-tools.sh "$RUNNER_TEMP/tools")
          echo "$dir" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist-release

      - name: Check the unsigned manifest matches this run
        env:
          GIT_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: |
          m=dist-release/manifest.json
          # Any job of this run could have replaced the release-dist artifact, so the bundle is the one
          # `package` built only if the manifest has the hash `package` published as a job output. The
          # tarballs are then held to the manifest (verify.sh) before anything is published.
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "package did not publish a manifest hash" >&2; exit 1; }
          sum=$(sha256sum "$m")
          [ "${sum%% *}" = "$MANIFEST_SHA256" ] || { echo "manifest.json is not the one package built" >&2; exit 1; }
          [ "$(jq -r .version "$m")" = "$VERSION" ] || { echo "manifest version mismatch" >&2; exit 1; }
          [ "$(jq -r .git_sha "$m")" = "$GIT_SHA" ] || { echo "manifest git_sha mismatch" >&2; exit 1; }
          [ "$(jq -r .channel "$m")" = "main" ] || { echo "manifest channel mismatch" >&2; exit 1; }
          # Exactly the expected artifacts, in the manifest and on disk, before anything is signed or uploaded.
          expected=$(printf '%s\n' \
            "hq-$VERSION-darwin-aarch64.tar.gz" "hq-$VERSION-darwin-x86_64.tar.gz" "hq-$VERSION-linux-aarch64.tar.gz" \
            "hq-$VERSION-linux-x86_64.tar.gz" "hq-web-$VERSION.tar.gz" | LC_ALL=C sort)
          listed=$(jq -r '.artifacts[].name' "$m" | LC_ALL=C sort)
          [ "$listed" = "$expected" ] || { echo "manifest artifacts are not the expected set:" >&2; echo "$listed" >&2; exit 1; }
          on_disk=$(cd dist-release && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          want_disk=$(printf '%s\nSHA256SUMS\nmanifest.json\n' "$expected" | LC_ALL=C sort)
          [ "$on_disk" = "$want_disk" ] || { echo "dist-release does not hold exactly the expected files:" >&2; echo "$on_disk" >&2; exit 1; }
          # SHA256SUMS is published too and is not covered by the manifest hash: it must say exactly what the manifest says.
          sums_want=$(jq -r '.artifacts[] | "\(.sha256)  \(.name)"' "$m" | LC_ALL=C sort)
          [ "$(LC_ALL=C sort dist-release/SHA256SUMS)" = "$sums_want" ] || { echo "SHA256SUMS does not match the manifest" >&2; exit 1; }

      - name: Refuse to overwrite an existing release
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists (run attempt $ATTEMPT). Releases are immutable: start a new run instead of re-running." >&2
            exit 1
          fi

      - name: Sign manifest
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash scripts/release/sign.sh dist-release/manifest.json

      - name: Verify
        run: bash scripts/release/verify.sh --dir dist-release --pubkey release/minisign.pub

      # Draft first, publish after every asset is attached, so a consumer never
      # sees a new manifest next to a missing or old tarball.
      - name: Publish release
        env:
          SHA: ${{ github.sha }}
        run: |
          files=(dist-release/hq-*.tar.gz dist-release/SHA256SUMS dist-release/manifest.json dist-release/manifest.json.minisig)
          gh release create "$TAG" "${files[@]}" --draft --target "$SHA" --title "$TAG" --prerelease \
            --notes "Build of ${SHA} from main. Promote with the Promote workflow."
          gh release edit "$TAG" --draft=false --prerelease

      - name: Publish signed channel-main pointer
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash scripts/release/channel.sh --channel main --repo "$GH_REPO" --manifest dist-release/manifest.json \
            --seq "$((RUN_NUMBER * 1000 + ATTEMPT))" --out dist-release/channel-main.json
          bash scripts/release/sign.sh dist-release/channel-main.json
          gh release view channel-main > /dev/null 2>&1 ||
            gh release create channel-main --title "channel-main" --prerelease \
              --notes "Signed pointer to the latest main build. Not a downloadable build."
          gh release upload channel-main dist-release/channel-main.json dist-release/channel-main.json.minisig --clobber

  # The same hq the release builds, for 64-bit Android, with the release key compiled in.
  # No secrets, no environment: it runs repository build code.
  android-hq:
    name: Build hq for Android
    if: github.ref == 'refs/heads/main'
    needs: [version]
    permissions:
      contents: read # checkout only
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Builds the signed APK. This job runs Gradle with the app signing keystore, so it is a separate
  # job from `android-publish`, which holds the minisign key and runs no build code. The keystore is
  # written to a temporary file and deleted at the end, whatever happens.
  android-apk:
    name: Build Android APK
    # The pull request's CI already ran these tests before the merge, and `sign` still waits for `test`.
    needs: [version, android-hq, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read # checkout only
    outputs:
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hq-android-arm64
          path: android-in/hq

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: android-in/web

      # The expected hashes are job outputs of `android-hq` and `web`, not files from the artifacts,
      # which any job of this run could have replaced.
      - name: Check hq and the web build, and fetch the pinned Caddy
        env:
          HQ_SHA256: ${{ needs.android-hq.outputs.sha256 }}
          WEB_TREE_SHA256: ${{ needs.web.outputs.tree_sha256 }}
        run: |
          [[ "$HQ_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "android-hq did not publish its hash" >&2; exit 1; }
          [[ "$WEB_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "web did not publish its hash" >&2; exit 1; }
          echo "$HQ_SHA256  android-in/hq/hq-android-arm64" | sha256sum --check --strict -
          tree=$(cd android-in/web && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum)
          [ "${tree%% *}" = "$WEB_TREE_SHA256" ] || { echo "web-dist is not the tree the web job built" >&2; exit 1; }
          [ -z "$(find android-in/hq android-in/web ! -type f ! -type d)" ] || { echo "artifacts hold something other than files" >&2; exit 1; }
          mkdir -p android-in/caddy
          url="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_arm64.tar.gz"
          curl -fsSL --retry 3 -o android-in/caddy.tar.gz "$url"
          echo "$CADDY_ARM64_SHA256  android-in/caddy.tar.gz" | sha256sum -c -
          tar -xzf android-in/caddy.tar.gz -C android-in/caddy caddy

      - name: Install an Android platform
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Check the Gradle wrapper jar
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  apps/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Decode the keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_RELEASE_KEYSTORE_B64 is not set in the release environment" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HQ_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: apps/android
        env:
          HQ_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          HQ_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          # versionCode rises with every release run, which is all Android needs to accept the update.
          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -Phq.bin="$GITHUB_WORKSPACE/android-in/hq/hq-android-arm64" \
            -Phq.caddy="$GITHUB_WORKSPACE/android-in/caddy/caddy" \
            -Phq.web="$GITHUB_WORKSPACE/android-in/web" \
            -Phq.versionCode="$RUN_NUMBER" -Phq.versionName="$VERSION" \
            -Phq.releasesRepo="${{ github.repository }}"

      - name: Check the APK is signed by the release key
        id: apk
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          bash scripts/release/android-check.sh "$apk"
          mkdir -p android-out
          cp "$apk" android-out/agent-hq-android.apk
          sum=$(sha256sum android-out/agent-hq-android.apk)
          echo "apk_sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: android-out/agent-hq-android.apk
          if-no-files-found: error
          retention-days: 7

      - name: Delete the keystore
        if: always()
        run: |
          if command -v shred > /dev/null; then shred -u "$RUNNER_TEMP/release.jks" 2> /dev/null || true; fi
          rm -f "$RUNNER_TEMP/release.jks"

  # Runs no build code: re-checks the APK, describes it, signs the description with the minisign key
  # and attaches everything to the release `sign` published.
  android-publish:
    name: Sign and publish Android APK
    needs: [version, sign, android-apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # upload assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "release runs from main only" >&2; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            release
          sparse-checkout-cone-mode: false

      - name: Install pinned minisign and jq
        run: |
          dir=$(bash scripts/release/install-tools.sh "$RUNNER_TEMP/tools")
          echo "$dir" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: android-out

      - name: Describe the APK
        env:
          APK_SHA256: ${{ needs.android-apk.outputs.apk_sha256 }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          [ "$(ls -A android-out)" = "agent-hq-android.apk" ] || { echo "android-out holds more than the APK" >&2; exit 1; }
          # The APK android-apk built, by the hash it published as a job output, not just any APK
          # someone uploaded under the artifact's name.
          [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "android-apk did not publish the APK hash" >&2; exit 1; }
          echo "$APK_SHA256  android-out/agent-hq-android.apk" | sha256sum --check --strict -
          # seq is the signing time in seconds, so it rises across release, promote and withdraw, and a
          # phone refuses a replayed older manifest (resolutions.md D-3).
          bash scripts/release/android-channel.sh --apk android-out/agent-hq-android.apk --version "$VERSION" --tag "$TAG" \
            --repo "$GH_REPO" --out android-out/android-channel.json --seq "$(date -u +%s)"
          (cd android-out && sha256sum agent-hq-android.apk > agent-hq-android.apk.sha256)
          cat android-out/android-channel.json

      - name: Sign the update manifest
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          bash scripts/release/sign.sh android-out/android-channel.json
          minisign -V -p release/minisign.pub -m android-out/android-channel.json -x android-out/android-channel.json.minisig

      - name: Attach to the release and the main channel
        run: |
          gh release upload "$TAG" android-out/agent-hq-android.apk android-out/agent-hq-android.apk.sha256 \
            android-out/android-channel.json android-out/android-channel.json.minisig
          gh release upload channel-main android-out/android-channel.json android-out/android-channel.json.minisig --clobber
