<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HQ Hub</title>
  <link rel="stylesheet" href="aligned-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="a-app hub-app" id="app">
    <header class="a-top hub-top">
      <span class="hub-mark" aria-hidden="true"><span class="a-mark"></span></span>
      <div class="a-tt"><h1 class="a-title">HQ Hub</h1><span class="a-status"><span id="hub-dot" class="a-dot"></span><span id="hub-status"></span></span></div>
    </header>
    <nav class="a-tabs" aria-label="Sections">
      <button type="button" class="a-tab" role="tab" data-tab="computer" aria-selected="true">This computer</button>
      <button type="button" class="a-tab" role="tab" data-tab="devices" aria-selected="false">Devices</button>
      <button type="button" class="a-tab" role="tab" data-tab="helpers" aria-selected="false">Helpers <em id="tab-need" class="hub-need" hidden></em></button>
    </nav>

    <main class="hub-main">
      <section id="tab-computer">
        <div id="hub-card" class="a-card">
          <div class="a-card-head"><b id="hub-title"></b><span id="hub-state" class="a-state"></span></div>
          <div id="hub-lines" class="hub-lines"></div>
          <p id="hub-open-why" class="hub-why"></p>
          <div class="a-card-actions">
            <button type="button" id="host-start" class="a-btn" hidden>Start HQ</button>
            <button type="button" id="open-hq" class="a-btn secondary">Open HQ</button>
            <button type="button" id="host-restart" class="a-btn secondary" hidden>Restart</button>
            <button type="button" id="host-stop" class="a-btn secondary" hidden>Stop HQ</button>
            <button type="button" id="choose-program" class="a-btn" hidden>Choose the HQ program…</button>
            <button type="button" id="look-again" class="a-btn secondary" hidden>Look again</button>
            <button type="button" id="allow-helpers" class="a-btn" hidden>Allow helpers again</button>
            <button type="button" id="copy-details" class="a-btn secondary" hidden>Copy details</button>
          </div>
          <div id="paste-row" class="hub-paste" hidden>
            <div class="a-field hub-paste-field">
              <label for="paste-path" id="paste-label" class="a-field-label"></label>
              <input id="paste-path" class="a-input" type="text" autocomplete="off" spellcheck="false">
            </div>
            <button type="button" id="paste-use" class="a-btn compact secondary">Use</button>
          </div>
          <p id="program-error" class="hub-why" role="alert"></p>
        </div>

        <div id="helpers-row" class="a-card hub-compact" hidden>
          <div class="a-card-head"><b id="helpers-row-title"></b><span id="helpers-row-state" class="a-state needs" hidden></span></div>
        </div>

        <div id="first-signin" class="a-card hub-compact" hidden>
          <div class="a-card-head"><b id="first-signin-title"></b></div>
          <p id="first-signin-note" class="hub-why"></p>
        </div>

        <div class="a-set hub-set">
          <div class="a-li"><div class="a-li-main"><b id="launch-title"></b><span id="launch-note"></span></div>
            <button type="button" id="set-start-on-launch" class="a-sw" role="switch" aria-checked="false" aria-labelledby="launch-title"></button></div>
          <div class="a-li"><div class="a-li-main"><b id="program-title"></b><span id="program-value"></span></div>
            <button type="button" id="change-program" class="a-btn compact quiet"></button></div>
          <div class="a-li"><div class="a-li-main"><b id="log-title"></b><span id="log-value"></span></div>
            <button type="button" id="open-log" class="a-btn compact quiet"></button></div>
        </div>
        <p id="host-error" class="hub-error" role="alert"></p>
      </section>

      <section id="tab-devices" hidden>
        <div id="devices-off" class="a-card">
          <div class="a-card-head"><b id="devices-off-title"></b><span id="devices-off-state" class="a-state"></span></div>
          <p id="devices-off-note" class="hub-why"></p>
          <div class="a-card-actions"><button type="button" class="a-btn" id="devices-on"></button></div>
        </div>
        <div id="devices-on-block" hidden>
          <div class="a-card">
            <div class="a-card-head"><b id="devices-on-title"></b><span id="devices-on-state" class="a-state"></span></div>
            <p id="devices-on-note" class="hub-why"></p>
            <div class="a-card-actions">
              <button type="button" class="a-btn" id="show-code"></button>
              <button type="button" class="a-btn secondary" id="devices-off-btn"></button>
            </div>
          </div>

          <div id="ticket" class="a-card" hidden>
            <div class="a-card-head"><b id="ticket-title"></b><span id="ticket-until" class="hub-why"></span></div>
            <p id="ticket-note" class="hub-why"></p>
            <canvas id="qr" width="256" height="256" aria-label="Pairing QR code"></canvas>
            <p class="row"><code id="ticket-link" class="link"></code></p>
            <p id="ticket-waiting" class="hub-why"></p>
            <div class="a-card-actions"><button type="button" class="a-btn compact secondary" id="copy-link"></button><button type="button" class="a-btn compact quiet" id="cancel-ticket"></button></div>
          </div>

          <p id="just-paired" class="hub-why" hidden></p>
          <div id="pending"></div>

          <div id="forwards-block" hidden>
            <p id="forwards-title" class="a-grp"></p>
            <div id="forwards" class="a-set hub-set"></div>
          </div>

          <p id="peers-title" class="a-grp"></p>
          <div id="peers" class="a-set hub-set"></div>
          <p id="peers-empty" class="hub-why"></p>
          <div id="share-block" class="a-set hub-set">
            <div class="a-li">
              <div class="a-li-main"><b id="share-title">Share this computer's model</b><span>Lends the model this Mac runs in Ollama to the phone it is paired with as its hub, and to no other device. The phone uses it while it can reach this Mac and its own model when it cannot. Turning this off ends what the phone has open at once.</span></div>
              <button type="button" id="share-on" class="a-sw" role="switch" aria-checked="false" aria-labelledby="share-title"></button>
            </div>
            <div class="a-li">
              <div class="a-li-main"><b id="share-model-title">Model</b><span id="share-state"></span></div>
              <select id="share-model" class="a-input hub-select" aria-labelledby="share-model-title"></select>
              <button type="button" class="a-btn compact quiet" id="share-check">Check again</button>
            </div>
          </div>
          <p id="share-warning" class="hub-error" role="alert"></p>
          <div class="a-set hub-set"><div class="a-li"><div class="a-li-main"><b id="relay-title"></b><span id="relay-note"></span></div><span id="relay-state" class="a-state"></span></div></div>
        </div>
        <p id="devices-error" class="hub-error" role="alert"></p>
      </section>

      <section id="tab-helpers" hidden>
        <div id="helpers-list">
          <p id="hh-intro" class="hub-why"></p>
          <div class="a-card-actions"><span id="hh-checked" class="hub-why"></span><button type="button" id="hh-check-all" class="a-btn compact secondary"></button></div>
          <div id="hh-first" class="a-card" hidden>
            <div class="a-card-head"><b id="hh-first-title"></b></div>
            <p id="hh-first-body" class="hub-why"></p>
            <p id="hh-first-body2" class="hub-why"></p>
            <p id="hh-off" class="hub-why"></p>
            <div class="a-card-actions"><button type="button" id="hh-first-act" class="a-btn"></button></div>
          </div>
          <div id="hh-lock" class="a-card" hidden>
            <div class="a-card-head"><b id="hh-lock-title"></b><span id="hh-lock-state" class="a-state needs"></span></div>
            <p id="hh-lock-body" class="hub-why"></p>
            <div class="a-card-actions"><button type="button" id="hh-lock-go" class="a-btn"></button></div>
          </div>
          <div id="hh-none" class="a-card" hidden>
            <div class="a-card-head"><b id="hh-none-title"></b></div>
            <p id="hh-none-body" class="hub-why"></p>
            <p class="row"><code id="hh-none-line"></code><button type="button" id="hh-none-copy" class="a-btn compact secondary"></button></p>
            <p id="hh-none-note" class="hub-why"></p>
          </div>
          <p id="hh-checking" class="hub-why" role="status"></p>
          <p id="hh-platform" class="hub-why" hidden></p>
          <div id="hh-work"></div>
          <div id="hh-groups"></div>
        </div>
        <div id="helper-detail" hidden></div>
        <p id="helpers-error" class="hub-error" role="alert"></p>
      </section>
    </main>

    <div id="scrim" class="a-scrim" hidden></div>
    <div id="dlg" class="a-dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
      <h2 id="dlg-title"></h2>
      <p id="dlg-body"></p>
      <div class="a-dlg-actions">
        <button type="button" id="dlg-keep" class="a-btn secondary"></button>
        <button type="button" id="dlg-act" class="a-btn"></button>
      </div>
    </div>
    <div id="sheet" class="a-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="a-sheet-head"><h2 id="sheet-title" class="a-h2"></h2><button type="button" id="sheet-close" class="a-btn compact quiet"></button></div>
      <div class="a-sheet-body"><p id="sheet-note" class="hub-why"></p><pre id="sheet-log" class="hub-log"></pre></div>
    </div>
    <div id="toast" class="a-snack" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-act" class="a-snack-act" hidden></button><button type="button" id="toast-close" class="a-snack-act"></button></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
