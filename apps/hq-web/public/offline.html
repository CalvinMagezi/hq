<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>HQ - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Monaco, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      text-align: center;
    }
    .container { max-width: 400px; padding: 2rem; }
    .pulse {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid #00ffa3;
      margin: 0 auto 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.75rem; }
    p { font-size: 0.8rem; color: #666; line-height: 1.6; margin-bottom: 1.5rem; }
    .retry {
      display: inline-block;
      text-decoration: none;
      background: rgba(0,255,163,0.1);
      border: 1px solid rgba(0,255,163,0.3);
      color: #00ffa3;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry:hover { background: rgba(0,255,163,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="pulse"></div>
    <h1>Offline</h1>
    <p>HQ Control Center is reconnecting. Cached data may be available once the connection is restored.</p>
    <a class="retry" href="/">Retry</a>
  </div>
</body>
</html>
