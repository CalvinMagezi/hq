# Every sentence HQ shows, phone and web, one key each (docs/plans/ux-run/decisions.md N19).
# Whole sentences only: never build a line from fragments. A placeholder is a name, a number or a
# time, written {name}. A plural is a map of CLDR forms (one, other). Run
# `bun scripts/strings/build.ts` after an edit; CI checks the generated files are current.

