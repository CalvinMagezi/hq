ShortDescription: Web app, tasks, notes and MCP for locked-down Windows computers.
Description: HQ Lite is the native Windows edition of Agent-HQ, a local-first assistant hub. It runs without WSL2 or administrator rights and serves the web app, task system and notes, and works with VS Code over MCP. It has no coding-agent host. Builds are signed with HQ's release key (minisign, checked by the HQ installer) but have no Windows code-signing certificate, so a computer that only allows approved programs may refuse to run it.
