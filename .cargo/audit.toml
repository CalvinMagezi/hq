# Read by `cargo audit`. `cargo deny check` reads deny.toml instead, so keep the
# two lists in step. The reason for each id lives in deny.toml.
[advisories]
ignore = [
    # quick-xml 0.38.4 via typst -> hayagriva -> citationberg. Not reachable from
    # note content. Drop when citationberg depends on quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zip 8.6.0, all in archive extraction (ZipArchive::extract, ZipStreamReader::extract)
    # that nothing here calls. Review on 2026-10-31, or when docx-rs, umya-spreadsheet and
    # transmutation move to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zstd and zstd-safe, pinned by zip 8.6.0. Unreachable; reasons in deny.toml.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0398",
]
