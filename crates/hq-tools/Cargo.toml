[package]
name = "hq-tools"
version.workspace = true
edition.workspace = true

[dependencies]
hq-host = { workspace = true }
hq-core = { workspace = true }
hq-vault = { workspace = true }
hq-db = { workspace = true }
hq-llm = { workspace = true }
hq-memory = { workspace = true }
hq-convert = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
gray_matter = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"
which = { workspace = true }
html2text = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }

[features]
default = [
    "gws",
]
# Each of these gates one optional, domain-specific tool category (SaaS
# integration, niche utility) that isn't needed by every deployment —
# default-on today, matching every build that exists; a future non-default
# build is what would actually exercise turning one off.
gws = []

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
wiremock = "0.6"
