[package]
name = "hq-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Bridge pairing: a one-time ticket, six typed digits, then reconnect by key over iroh"

[dependencies]
hq-core = { workspace = true }
hq-db = { workspace = true }
# Pinned exactly: the spike's lock file (the phone measurements in docs/plans/native-bridge/spike-f)
# resolved 1.4.1, and iroh's API still moves between minor versions.
iroh = "=1.4.1"
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
data-encoding = "2"
qrcodegen = "1.8"
chrono = { workspace = true }
dirs = { workspace = true }
subtle = "2"
tempfile = { workspace = true }
url = { workspace = true }

# The host gate's key files, for setup after pairing (`setup.rs`). Unix only, like the gate.
[target.'cfg(unix)'.dependencies]
hq-gate = { workspace = true }

