[package]
name = "hq-web"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
hq-agent = { workspace = true }
hq-convert = { workspace = true }
hq-export = { workspace = true }
hq-core = { workspace = true }
hq-llm = { workspace = true }
hq-mcp = { workspace = true }
hq-tools = { workspace = true }
chrono = { workspace = true }
serde_yaml = { workspace = true }
hq-db = { workspace = true }
hq-vault = { workspace = true }
rusqlite = { workspace = true }
tokio-rustls = "0.26"
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
ring = "0.17"
tower = { workspace = true, features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# The connector's own TLS (src/tls/). Exact versions: certificate issuance and the TLS-ALPN-01
# challenge are security-relevant, so they move only when someone has read the changelog.
instant-acme = { version = "=0.8.5", default-features = false, features = ["aws-lc-rs"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "=0.18.1"
http = "1"
http-body-util = "0.1"
bytes = "1"
zeroize = "1"
thiserror = { workspace = true }

[dev-dependencies]
url = { workspace = true }
hq-core = { workspace = true, features = ["test-util"] }
tempfile = "3"
time = "0.3"
hyper = { version = "1", features = ["client"] }
# The test ACME server reads the certificate request the client sends.
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The connector door's socket directory must belong to the user running the server.
libc = "0.2"
