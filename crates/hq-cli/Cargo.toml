[package]
name = "hq-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hq"
path = "src/main.rs"

[features]
default = ["discord", "telegram", "bridge"]
discord = ["hq-relay/discord"]
telegram = ["hq-relay/telegram"]
# `hq net tunnel`: this device as a userspace WireGuard peer (the phone app builds with it; a
# server build leaves it out). Unix only: the dependency is not pulled on Windows.
tunnel = ["dep:hq-tunnel", "dep:libc", "dep:zeroize"]
# `hq bridge`: pair machines with a QR code and reach them by key over iroh. On by default so every
# installed laptop or server can pair with a phone; nothing listens until a command is run. Unix
# only: the dependencies are not pulled on Windows, where the commands are compiled out.
bridge = ["dep:hq-bridge", "hq-edge/invite"]

[dependencies]
hq-core = { workspace = true }
hq-vault = { workspace = true }
hq-db = { workspace = true }
hq-llm = { workspace = true }
hq-tools = { workspace = true }
hq-convert = { workspace = true }
hq-export = { workspace = true }
hq-update = { workspace = true }
hq-backup = { workspace = true }
hq-host = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
hq-web = { workspace = true }
hq-daemon = { workspace = true }
hq-relay = { workspace = true }
hq-memory = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }

hq-mcp = { workspace = true }
rpassword = "7"
hq-agent = { workspace = true }
crossterm = "0.28"
rusqlite.workspace = true
url = { workspace = true }
mimalloc = { version = "0.1", default-features = false }

# native-tls (pulled in transitively via reqwest/teloxide) links system
# OpenSSL on Linux. Cross-compiling for Linux from a non-Linux host has no
# target OpenSSL to find via pkg-config, and Android has none to find at
# all, so build OpenSSL from source instead — irrelevant on macOS/Windows,
# where native-tls uses the platform's own TLS backend and openssl-sys
# isn't even pulled in.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
openssl-sys = { version = "*", features = ["vendored"] }

# The edge is a server program: it links iroh and the iroh relay, which the Android and Windows
# builds do not carry. `hq edge` on those targets explains that and exits.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
hq-edge = { workspace = true }
iroh = "=1.4.1"

[target.'cfg(unix)'.dependencies]
hq-gate = { workspace = true }
hq-net = { workspace = true }
hq-tunnel = { workspace = true, optional = true }
hq-bridge = { workspace = true, optional = true }
# Only the tunnel commands use these two: a terminal check, and wiping a key they print.
libc = { version = "0.2", optional = true }
zeroize = { version = "1", optional = true }

# The phone app runs `hq` as a child process, which has no JVM. See `android_runtime.rs`.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "=0.1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
hq-tools = { workspace = true, features = ["test-support"] }
hq-sandbox = { path = "../hq-sandbox" }
tempfile = { workspace = true }
wiremock = "0.6"
