[package]
name = "hq-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logic behind the desktop app: host lifecycle, device pairing and the loopback proxy. No GUI dependencies; the Tauri shell in apps/desktop is a thin layer over it"

[dependencies]
hq-core = { workspace = true }
hq-db = { workspace = true }
hq-bridge = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hostname = { workspace = true }
dirs = { workspace = true }
qrcodegen = "1.8"
subtle = "2"

[dev-dependencies]
tempfile = { workspace = true }
hq-host = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
