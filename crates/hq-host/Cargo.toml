[package]
name = "hq-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent HQ's built-in host for long-lived coding agents (pty hosting, state detection, control API)"

[dependencies]
hq-sandbox = { path = "../hq-sandbox" }
hq-acp = { path = "../hq-acp" }
portable-pty = "0.9"
vt100 = "0.16"
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["signal", "user"] }

which = "7"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hq-host-fake-acp-agent"
path = "../hq-acp/tests/support/fake_agent.rs"
test = false
doc = false
