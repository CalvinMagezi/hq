[package]
name = "hq-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hq edge: a blind public forwarder that routes TLS connections by server name to a paired device over iroh"

[dependencies]
# Pinned: the wire behavior of iroh and its relay is what the device side is tested against.
iroh = "=1.4.1"
iroh-relay = { version = "=1.4.1", features = ["server"] }
anyhow = { workspace = true }
dirs = { workspace = true }
figment = { workspace = true }
hex = { workspace = true }
libc = "0.2"
# Parses the ClientHello (server name) without deriving any keys; never completes a handshake.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Both providers on, as in any build that includes hq-web (it pulls in aws-lc-rs): rustls then
# cannot choose a process default itself, which is what the relay's start-up must survive. With
# only ring, as `-p hq-edge` alone would have, the test for it would pass without the fix.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
