[package]
name = "hq-suite-shrink"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shrinking documents and media into the small record, and measuring how much that saves"

# May know the other suite crates and hq-convert, nothing else of HQ (crates/suite/CLAUDE.md).
[dependencies]
hq-convert = { workspace = true }
hq-suite-ingest = { workspace = true }
hq-suite-md = { workspace = true }
hq-suite-store = { workspace = true }
# Same feature set as hq-export, so the phone binary links one copy of each codec.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Candidate encoders. They exist to be measured (`hq suite measure --encoders ...`) and are off
# by default, so a normal build links only what the phone ships. The one chosen in M0 becomes a
# default dependency and the others are dropped.
oxideav-webp = { version = "0.3", default-features = false, optional = true }
webp = { version = "0.3", default-features = false, optional = true }
ravif = { version = "0.13", default-features = false, optional = true }
imgref = { version = "1", optional = true }
rgb = { version = "0.8", optional = true }

[features]
default = []
# Lossy WebP in pure Rust (young crate; a candidate, not yet reviewed for hostile input).
cand-webp-pure = ["dep:oxideav-webp"]
# Lossy WebP through libwebp (C). The reference for size and quality.
cand-webp-lib = ["dep:webp"]
# AVIF through rav1e (pure Rust, slow on a phone CPU).
cand-avif = ["dep:ravif", "dep:imgref", "dep:rgb"]
candidates = ["cand-webp-pure", "cand-webp-lib", "cand-avif"]

[dev-dependencies]
tempfile = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
