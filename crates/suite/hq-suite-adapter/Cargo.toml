[package]
name = "hq-suite-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The one place the HQ Suite meets HQ: commands, configuration and, later, tools and daemon tasks"

# The only suite crate allowed to know HQ. Everything else stays free of it so the suite can be
# lifted out (crates/suite/CLAUDE.md, enforced by tests/boundary.rs).
[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hq-backup = { workspace = true }
hq-convert = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
hq-vault = { workspace = true }
hq-suite-store = { workspace = true }
hq-suite-shrink = { workspace = true }
calamine = { version = "0.38", features = ["chrono"] }
hq-suite-calc = { workspace = true }
hq-suite-docs = { workspace = true }
hq-suite-governor = { workspace = true }
hq-suite-md = { workspace = true }
hq-suite-sinks = { workspace = true }
hq-suite-slides = { workspace = true }
hq-suite-xlsx = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
# Dev only: the test that proves the Suite reads the finance ledger. Nothing in src/ names it.
hq-finance = { path = "../../hq-finance" }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
