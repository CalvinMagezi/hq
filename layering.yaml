# What may depend on what in this workspace.
#
# `cargo test -p hq-core --test layering` reads this file, asks cargo for the workspace's crates
# and their dependencies, reads every file under `src/` of the crates below the app tier, and
# fails when they disagree. The design, and the order the debt below is paid in, is
# docs/plans/modular-hq.md.
#
# The rules:
#   1. In the contract and kernel tiers, a crate depends only on crates in a tier above its own
#      in this file or listed before it in its own tier. The base (contract and kernel) never
#      depends on a module.
#   2. A module crate depends on the base, and on another module crate only when `module_edges`
#      says so.
#   3. Code outside a module does not name the module's files, wherever they live (`in_crate`),
#      and base code does not name a module crate unless it belongs to a module that may
#      (`module_uses`). The app tier is exempt: it is where modules are put together.
#
# `debt` lists where today's code breaks a rule. An entry may be removed and a number may fall,
# in the same change that fixes the code. Never add an entry or raise a number to make the test
# pass: invert the dependency instead (a trait or a registration in the lower crate). Changing a
# tier or adding an edge is a design change and should say why.
#
# The source check reads paths as written. It does not see a name used after it was imported, a
# rename with `as`, a file mounted with `#[path]` or a `tests/` folder, and it counts unit tests
# under `src/`. A module is ready to be left out of a build when the build without it compiles,
# not when its numbers here reach zero.

tiers:
  # What every other crate agrees on: types, config, the caller markers (hq-core) and the tool
  # trait and registry (hq-contract). hq-core depends on no HQ crate, hq-contract on hq-core.
  contract:
    - hq-core
    - hq-contract
  # What every build of hq links: storage, models, the agent loop and its guards, the base
  # tools, the gateway, the scheduler, the web server, signed updates and restore.
  kernel:
    - hq-vault
    - hq-db
    - hq-llm
    - hq-memory
    - hq-update
    - hq-backup
    - hq-tools
    - hq-agent
    - hq-mcp
    - hq-daemon
    - hq-web
  # What a build may leave out.
  module:
    - hq-sandbox
    - hq-host
    - hq-gate
    - hq-net
    - hq-tunnel
    - hq-convert
    - hq-export
    - hq-bridge
    - hq-edge
    - hq-relay
  # Where the pieces are put together. May depend on anything below.
  app:
    - hq-cli
    - hq-desktop

module_edges:
  hq-host: [hq-sandbox]
  hq-tunnel: [hq-net]
  hq-export: [hq-convert]
  hq-bridge: [hq-gate]
  hq-edge: [hq-bridge]
  hq-relay: [hq-convert]

# Modules that still live inside kernel crates. Each will become its own crate or sit behind a
# cargo feature; until then these paths are its walls.
in_crate:
  # Sessions of other coding agents (Claude Code, Codex and the rest): the host client, the
  # session tools and supervisor messaging. The host server itself is hq-host.
  helpers:
    hq-tools:
      - src/harness_session
      - src/agent_host
      - src/a2a.rs
      - src/harness_usage.rs
      - src/harness_usage_collect.rs
    hq-web:
      - src/sessions_api.rs
      - src/session_driver.rs
      - src/session_driver
      - src/workbench_api.rs
      - src/dialog_answer.rs
      - src/session_folders_api.rs
  # HQ Coder: HQ's own agent doing GitHub work. Reading and cloning a repository
  # (github/mod.rs, tarball.rs) stays in the base because task verification uses it. Those
  # read tools take their token from the App client in app.rs, which is most of what
  # `hq-tools -> coder` counts in github/mod.rs: either the token client moves to the base or
  # the read tools reach it through a contract.
  coder:
    hq-tools:
      - src/github/app.rs
      - src/github/app_tests.rs
      - src/github/coder.rs
      - src/github/dispatch.rs
      - src/github/dispatch_tests.rs
      - src/github/write.rs
      - src/github/write_tests.rs
      - src/github/repos.rs
      - src/github/repos_tests.rs
      - src/github/changes.rs
    hq-web:
      - src/coder_api.rs
      - src/github_connect_api.rs
      - src/github_connect_api_tests.rs
      - src/edge_worker_api.rs
  # Task verification. The guard on completing a task stays with tasks in hq-db.
  verify:
    hq-tools:
      - src/tasks/verify
    hq-web:
      - src/verification_api.rs
  # The claude.ai connector: OAuth and its TLS door.
  connector:
    hq-web:
      - src/oauth
      - src/tls

# Module crates a module's own files may name.
module_uses:
  helpers: [hq-host, hq-gate]
  # Only its end-to-end test (src/tls/tests), through dev-dependencies.
  connector: [hq-bridge, hq-edge]

debt:
  # Base crates that link a module crate today.
  cargo_edges:
    # The host client, for the session tools and for the hardened git the base git tool runs
    # (coding/git.rs). Goes when the client half of hq-host is a kernel crate of its own.
    - hq-tools -> hq-host
    # The gate transport of the host client. Goes when the session tools sit behind a feature
    # and the dependency is optional.
    - hq-tools -> hq-gate
    # Note export (Typst and its fonts). Goes when export sits behind a cargo feature.
    - hq-tools -> hq-export
    - hq-web -> hq-export
    # Document import, also used for chat attachments. Goes when the base has its own
    # attachment reader and import sits behind a feature.
    - hq-tools -> hq-convert
    - hq-web -> hq-convert

  # Places outside a module that name it, by where they are written.
  refs:
    # Tool assembly (builder/tools.rs), the guard lists that import module symbols
    # (governance/) and the sub-agent service. Goes when tools register through one list and
    # governance takes its constants from the contract.
    hq-agent -> helpers: 13
    hq-agent -> coder: 9
    # The default tool registry building the session, host and team-messaging tools. Goes when
    # the registry builder leaves hq-mcp.
    hq-mcp -> helpers: 3
    # Task tools calling the session access checks, approval text for two helper tools, and
    # the crate root's re-exports.
    hq-tools -> helpers: 8
    # Task tools calling the coder queue's write guards, and the GitHub read tools taking
    # their token from the App client.
    hq-tools -> coder: 24
    # The handover check and the GitHub reader that task tools take from verification, and
    # the task tests that build its fake.
    hq-tools -> verify: 21
    # The router mounting module routes, and the chat socket, inbox and task routes calling
    # into module code. Goes when module routes are merged from a list and the web kernel
    # offers a hook for each call (task changed, inbox answer, after reply).
    hq-web -> helpers: 29
    hq-web -> coder: 14
    hq-web -> verify: 16
    hq-web -> connector: 11
    # The Workbench resolving a note through HQ Coder's helper.
    helpers -> coder: 1
    # Base files that name a module crate directly. These go with the crate edges above.
    hq-tools -> hq-host: 2
    hq-tools -> hq-convert: 24
    hq-tools -> hq-export: 2
    hq-web -> hq-convert: 3
    hq-web -> hq-export: 7
